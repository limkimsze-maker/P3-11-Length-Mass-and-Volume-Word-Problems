name: One-time bar model bracket fix

on:
  push:
    paths:
      - '.github/workflows/bracket-fix.yml'

permissions:
  contents: write

jobs:
  fix-brackets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing bar-model brackets
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def patch(needle, replacement, label):
              global text
              if needle not in text:
                  raise RuntimeError(f'Missing expected section: {label}')
              text = text.replace(needle, replacement, 1)

          # Equal packets: whole, packed/used parts, packed group and one packet.
          patch(
          '''    <rect x="${80+packedW}" y="32" width="${usedW}" height="28" fill="#f7ae2b" stroke="#222" stroke-width="2"/>
    <text x="${80+(packedW+usedW)/2}" y="17"''',
          '''    <rect x="${80+packedW}" y="32" width="${usedW}" height="28" fill="#f7ae2b" stroke="#222" stroke-width="2"/>
    <path d="M80 26 v-8 h${packedW+usedW} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M80 66 v8 h${packedW} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M${80+packedW} 66 v8 h${usedW} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <text x="${80+(packedW+usedW)/2}" y="17"''', 'packets upper brackets')

          patch(
          '''    ${divs}
    <text x="${80+packedW/2}" y="115"''',
          '''    ${divs}
    <path d="M80 120 v-8 h${packedW} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M80 160 v8 h${unitW} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <text x="${80+packedW/2}" y="115"''', 'packets lower brackets')

          # Bottles and total: one unit, first person's whole, both parts and total.
          patch(
          '''    ${top}
    <text x="${72+unitW/2}" y="20"''',
          '''    ${top}
    <path d="M72 28 v-8 h${unitW} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M72 66 v8 h${firstW} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <text x="${72+unitW/2}" y="20"''', 'bottle unit brackets')

          patch(
          '''    <rect x="${72+p1W}" y="130" width="${p2W}" height="28" fill="#9ec6ea" stroke="#222" stroke-width="2"/>
    <text x="${72+p1W/2}" y="122"''',
          '''    <rect x="${72+p1W}" y="130" width="${p2W}" height="28" fill="#9ec6ea" stroke="#222" stroke-width="2"/>
    <path d="M72 124 v-8 h${p1W} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M${72+p1W} 124 v-8 h${p2W} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M72 164 v8 h${p1W+p2W} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <text x="${72+p1W/2}" y="122"''', 'bottle total brackets')

          # Bags: one bag, given-away group and remaining group.
          patch(
          '''    ${units}
    <text x="${72+unitW/2}" y="20"''',
          '''    ${units}
    <path d="M72 32 v-8 h${unitW} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M72 72 v8 h${unitW*given} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M${72+unitW*given} 72 v8 h${unitW*left} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <text x="${72+unitW/2}" y="20"''', 'bag brackets')

          # Times-as-much: whole amount and difference portion.
          patch(
          '''    ${top}
    <rect x="120" y="80" width="${unitW}" height="28" fill="#f0ae3c" stroke="#222" stroke-width="2"/>
    <text x="${120+unitW*factor/2}" y="19"''',
          '''    ${top}
    <rect x="120" y="80" width="${unitW}" height="28" fill="#f0ae3c" stroke="#222" stroke-width="2"/>
    <path d="M120 28 v-8 h${unitW*factor} v8" fill="none" stroke="#000" stroke-width="1.8"/>
    <path d="M${120+unitW} 66 v8 h${unitW*(factor-1)} v-8" fill="none" stroke="#000" stroke-width="1.8"/>
    <text x="${120+unitW*factor/2}" y="19"''', 'times-as-much brackets')

          path.write_text(text, encoding='utf-8')
      - name: Commit bracket fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore missing bar model brackets"
          git push
