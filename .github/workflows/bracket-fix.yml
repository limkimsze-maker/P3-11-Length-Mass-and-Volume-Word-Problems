name: One-time bar model bracket fix

on:
  push:
    paths:
      - '.github/workflows/bracket-fix.yml'
      - '.github/scripts/fix_brackets.py'

permissions:
  contents: write

jobs:
  fix-brackets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing brackets
        run: python .github/scripts/fix_brackets.py
      - name: Commit bracket fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore missing bar model brackets"
          git push
