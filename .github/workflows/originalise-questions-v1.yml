name: Originalise Questions V1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('Answer multi-step word problems based on the familiar worksheet examples.','Answer original Sports Fiesta multi-step word problems using familiar mathematical strategies.')
          s=s.replace('${person} bought <b>${total} ml</b> of ${liquid}. ${person} drank <b>${a} ml</b> on Saturday and <b>${b} ml</b> on Sunday.<br>(i) How much did ${person} drink over the two days?<br>(ii) What was the volume of ${liquid} left after the two days?','A Sports Fiesta drink cooler held <b>${total} ml</b> of fruit drink. The team served <b>${a} ml</b> during the first break and <b>${b} ml</b> during the second break.<br>(i) How much drink was served altogether?<br>(ii) What volume was left in the cooler?')
          s=s.replace('${person} had <b>${total} g</b> of ${food}. ${person} packed some ${food} equally into <b>${packets}</b> packets and used the remaining <b>${used} g</b>. What mass did ${person} pack into each packet?','A helper prepared <b>${total} g</b> of sports drink powder. After setting aside <b>${used} g</b>, the rest was shared equally among <b>${packets}</b> team packets. What mass of powder went into each packet?')
          s=s.replace('There are <b>${each} ml</b> of water in each bottle. ${p1} drinks <b>${bottles}</b> bottles. ${p2} drinks <b>${second} ml</b> of water. How much water do they drink in total? Give your answer in litres and millilitres.','Each blue-team bottle holds <b>${each} ml</b> of water. There are <b>${bottles}</b> blue-team bottles. A red-team jug contains another <b>${second} ml</b>. How much water is there altogether? Give your answer in litres and millilitres.')
          s=s.replace('${person} had <b>${totalBags}</b> bags of ${item}. Each bag had a mass of <b>${unit} g</b>. ${person} gave away <b>${given}</b> bags. How much ${item} did ${person} have left?','A team had <b>${totalBags}</b> bags of soft training markers. Each bag had a mass of <b>${unit} g</b>. <b>${given}</b> bags were moved to another activity station. What was the mass of the bags left?')
          s=s.replace('${pa} travelled <b>${total} ${unitWord}</b>. ${pa} travelled <b>${factor}</b> times as much as ${pb}. How much further did ${pa} travel than ${pb}?','Route A is <b>${total} ${unitWord}</b> long. Route A is <b>${factor}</b> times as long as Route B. How much longer is Route A than Route B?')
          hook='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-original-questions-v1.js?v=20260810a" data-practice="11"></script>\n'
          marker='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-medal-hook-v4.js'
          if 'sports-fiesta-original-questions-v1.js' not in s: s=s.replace(marker,hook+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Use original Sports Fiesta multi-step problems"
          git push
